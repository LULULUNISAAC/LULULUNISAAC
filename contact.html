<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Contact · ISAAC LWL</title>
<style>
  :root{color-scheme:dark}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#000;color:#fff;
       font-family:ui-monospace,"SF Mono",Menlo,Consolas,"PingFang TC","Microsoft JhengHei",monospace}
  .card{width:min(520px,92vw);padding:36px;border:1px solid #262626;border-radius:26px;background:#0a0a0a}
  small{color:#777;letter-spacing:.2em}
  h1{margin:10px 0 6px;font-size:40px}
  p{color:#9a9a9a;line-height:1.6}
  button{font:inherit;cursor:pointer;border-radius:16px;padding:14px 22px;border:1px solid #333;background:#0a0a0a;color:#9a9a9a}
  button.primary{background:#fff;color:#000;border-color:#fff;font-weight:700;letter-spacing:.1em}
  .row{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap}
  a{color:#777}
</style>
</head>
<body>
<div class="card">
  <small id="k">CONTACT</small>
  <h1>ISAAC LWL</h1>
  <p id="msg">ML / data science · Hong Kong. Open to collaborations. Click the button and your mail app opens with my address filled in.</p>
  <div class="row">
    <button class="primary" id="mail">EMAIL ME</button>
    <button id="lang">繁體中文</button>
  </div>
  <p style="margin-top:26px"><a href="https://github.com/LULULUNISAAC">← GitHub</a></p>
</div>
<script>
  var zh = false;
  var T = {
    en: {k:"CONTACT", msg:"ML / data science · Hong Kong. Open to collaborations. Click the button and your mail app opens with my address filled in.", mail:"EMAIL ME", lang:"繁體中文"},
    zh: {k:"聯絡", msg:"機器學習 / 數據科學 · 香港。歡迎合作。按下按鈕即可開啟郵件程式並自動填入我的電郵地址。", mail:"寄電郵給我", lang:"English"}
  };
  function draw(){
    var t = T[zh ? "zh" : "en"];
    document.getElementById("k").textContent = t.k;
    document.getElementById("msg").textContent = t.msg;
    document.getElementById("mail").textContent = t.mail;
    document.getElementById("lang").textContent = t.lang;
    document.documentElement.lang = zh ? "zh-Hant" : "en";
  }
  document.getElementById("lang").onclick = function(){ zh = !zh; draw(); };
  // the address is only assembled when clicked, so it never appears in the page text
  document.getElementById("mail").onclick = function(){
    var u = "lwlisaaclun", h = "gmail" + ".com";
    location.href = "mailto:" + u + "@" + h;
  };
  if ((navigator.language || "").toLowerCase().indexOf("zh") === 0) { zh = true; draw(); }
</script>
</body>
</html>
