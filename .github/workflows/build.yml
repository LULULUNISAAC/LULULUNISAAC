name: build-profile
on:
  schedule: [{ cron: "17 * * * *" }]
  workflow_dispatch:
  push: { branches: [main] }
permissions:
  contents: write
concurrency:
  group: build-profile
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore previous output
        run: git clone --depth 1 --branch output "https://github.com/${{ github.repository }}.git" dist || mkdir dist

      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt

      - name: Render panels
        run: python build.py
        env:
          GH_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Contribution snake (black and grey)
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#ffffff&color_dots=#141414,#333333,#5e5e5e,#9a9a9a,#e8e8e8
            
      - name: Put the snake on a dark rounded card     
        run: python build.py --snake 

      - name: Publish to the output branch
        run: |
          cd dist
          rm -rf .git
          git init -q -b output
          git config user.name "profile-bot"
          git config user.email "profile-bot@users.noreply.github.com"
          git add -A
          git commit -qm "render $(date -u +%FT%TZ)"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" output
